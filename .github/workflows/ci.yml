name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Lint (frontend)
        run: npm run lint

      - run: npm test

      - name: Database migration tests (isolated PostgreSQL)
        run: npm run test:database

      - name: Build (frontend + backend)
        run: npm run build
